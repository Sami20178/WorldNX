name: Build and publish WorldNX Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-android-apk.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for the GitHub release (use a new tag)"
        required: true
        default: "worldnx-android-v0.2.1"
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out WorldNX server repository
        uses: actions/checkout@v4
        with:
          path: server

      - name: Check required cross-repository token
        env:
          SOURCE_TOKEN: ${{ secrets.WORLDNX_SOURCE_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "Missing repository secret WORLDNX_SOURCE_TOKEN. Add a token that can read Sami20178/WorldNX-Source-Code in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out WorldNX client source
        uses: actions/checkout@v4
        with:
          repository: Sami20178/WorldNX-Source-Code
          ref: feature/serial-checker-native-apps
          path: source
          token: ${{ secrets.WORLDNX_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools, platforms;android-35, build-tools;35.0.0"

      - name: Prepare Android web app
        shell: bash
        run: |
          set -euo pipefail
          cd source/serial-checker-app
          mkdir -p web
          cp ../serial-checker/index.html web/index.html
          npm install @capacitor/core@^7 @capacitor/android@^7
          npm install --save-dev @capacitor/cli@^7
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd source/serial-checker-app/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../../../server/release-assets
          cp app/build/outputs/apk/debug/app-debug.apk ../../../server/release-assets/WorldNX-Serial-Checker-Android-debug.apk
          cd ../../../server/release-assets
          sha256sum WorldNX-Serial-Checker-Android-debug.apk > WorldNX-Serial-Checker-Android-debug.apk.sha256
          test -s WorldNX-Serial-Checker-Android-debug.apk
          test -s WorldNX-Serial-Checker-Android-debug.apk.sha256

      - name: Publish APK and checksum to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || format('worldnx-android-v0.2.{0}', github.run_number) }}
          name: WorldNX Android APK ${{ inputs.release_tag || format('worldnx-android-v0.2.{0}', github.run_number) }}
          target_commitish: main
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            WorldNX Android APK build.

            Included assets:
            - Android debug APK for the WorldNX Serial Checker
            - SHA-256 checksum file

            This is a debug APK for testing, not a Play Store-signed production release.
            The APK is the Serial Checker client; it is not the Node.js server itself.
          files: |
            server/release-assets/WorldNX-Serial-Checker-Android-debug.apk
            server/release-assets/WorldNX-Serial-Checker-Android-debug.apk.sha256
