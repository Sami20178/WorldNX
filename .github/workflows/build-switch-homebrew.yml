name: Build WorldNX Switch Homebrew

on:
  push:
    paths:
      - "switch-homebrew/**"
      - ".github/workflows/build-switch-homebrew.yml"
  pull_request:
    paths:
      - "switch-homebrew/**"
      - ".github/workflows/build-switch-homebrew.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nro:
    name: Compile WorldNX.nro
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nintendo Switch development libraries
        shell: bash
        run: |
          set -euo pipefail
          command -v curl
          PACMAN_CONF="${DEVKITPRO}/pacman/etc/pacman.conf"
          if [ ! -f "$PACMAN_CONF" ]; then
            PACMAN_CONF="$(find /etc /opt/devkitpro -name pacman.conf -type f -print -quit)"
          fi
          test -n "$PACMAN_CONF"
          test -f "$PACMAN_CONF"
          cp "$PACMAN_CONF" /tmp/dkp-pacman.conf
          # Use curl with a browser User-Agent for devkitPro's Cloudflare-protected package host.
          sed -i '/^\[options\]/a XferCommand = /usr/bin/curl -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" -L -C - -f -o %o %u' /tmp/dkp-pacman.conf
          dkp-pacman --config /tmp/dkp-pacman.conf -Sy --noconfirm
          dkp-pacman --config /tmp/dkp-pacman.conf -S --needed --noconfirm switch-dev
          test -s "$DEVKITPRO/libnx/lib/libnx.a"
          test -f "$DEVKITPRO/libnx/switch_rules"
          echo "libnx archive found:"
          ls -lh "$DEVKITPRO/libnx/lib/libnx.a"

      - name: Verify devkitA64 toolchain
        run: |
          test -x "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc" --version

      - name: Build NRO
        working-directory: switch-homebrew
        run: |
          set -euo pipefail
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          mkdir -p build
          make clean
          make V=1
          test -s build/WorldNX.nro
          file build/WorldNX.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldNX-homebrew-NRO
          path: switch-homebrew/build/WorldNX.nro
          if-no-files-found: error
