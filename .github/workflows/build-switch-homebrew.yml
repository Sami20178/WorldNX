name: Build WorldNX Switch Homebrew

on:
  push:
    paths:
      - "switch-homebrew/**"
      - ".github/workflows/build-switch-homebrew.yml"
  pull_request:
    paths:
      - "switch-homebrew/**"
      - ".github/workflows/build-switch-homebrew.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nro:
    name: Compile WorldNX.nro
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nintendo Switch development libraries
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm switch-dev
          test -f "$DEVKITPRO/libnx/lib/libnx.a"
          test -f "$DEVKITPRO/libnx/switch_rules"
      - name: Verify devkitA64 toolchain
        run: |
          test -x "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc" --version
      - name: Build NRO
        working-directory: switch-homebrew
        run: |
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          mkdir -p build
          make clean
          mkdir -p build
          make
          test -s build/WorldNX.nro
      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldNX-homebrew-NRO
          path: switch-homebrew/build/WorldNX.nro
          if-no-files-found: error
